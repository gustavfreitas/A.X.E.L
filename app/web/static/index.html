<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>A.X.E.L. - AI Dev Assistant</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/core.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
  <div class="app" id="app" data-state="welcome">

    <!-- Cabeçalho: marca à esquerda, modelo à direita -->
    <header class="topbar">
      <h2 class="brand">
        <span class="core" aria-hidden="true"><img class="core__img" src="/static/img/axel-logo.png" alt="" width="36" height="36" draggable="false"></span>
        <span class="brand__name">A.X.E.L.</span>
        <span class="brand__role">AI Dev Assistant</span>
      </h2>
      <div class="topbar__right">
        <button class="ghost" id="clear" type="button" hidden>Nova conversa</button>
        <span class="badge" id="badge" data-state="unknown">
          <span class="badge__dot" aria-hidden="true"></span>
          <span id="badgeText">verificando…</span>
        </span>
      </div>
    </header>

    <!-- Palco: cúpula de luz, boas-vindas e conversa -->
    <main class="stage">
      <div class="arc" aria-hidden="true"></div>

      <section class="hero" id="hero">
        <span class="core core--hero" role="img" aria-label="Símbolo do A.X.E.L.">
          <img class="core__img" src="/static/img/axel-logo.png" alt="" width="120" height="120" draggable="false">
        </span>
        <h1 class="hero__title">Seu assistente de debug para Python e SQL</h1>
        <p class="hero__sub">Cole o erro, o código ou a query lenta. O A.X.E.L. aponta a causa provável e sugere a correção.</p>
      </section>

      <section class="thread scroll" id="thread" aria-live="polite" aria-label="Conversa" hidden>
        <div class="thread__inner" id="threadInner"></div>
      </section>
    </main>

    <!-- Dock flutuante: sugestões e campo de texto -->
    <footer class="dock">
      <div class="chips" id="chips">
        <button class="chip" type="button" data-prompt="Minha query SQL está demorando 20s para 50 mil registros">Query SQL lenta</button>
        <button class="chip" type="button" data-prompt="TypeError: 'NoneType' object is not subscriptable na linha 42">Erro de NoneType</button>
        <button class="chip" type="button" data-prompt="Esse loop com append numa lista dentro de outro loop está muito lento">Loop lento em Python</button>
        <button class="chip" type="button" data-prompt="Qual a diferença entre INNER JOIN e LEFT JOIN na prática?">INNER JOIN ou LEFT JOIN</button>
      </div>
      <form class="composer" id="form">
        <textarea class="composer__input" id="input" rows="1" aria-label="Mensagem"
          placeholder="Descreva o bug, o erro ou a query lenta…"></textarea>
        <button class="composer__send" id="send" type="submit" aria-label="Enviar mensagem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="dock__hint">Enter envia, Shift+Enter quebra a linha. O modelo roda no seu computador e pode errar: confira o diagnóstico.</p>
    </footer>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
