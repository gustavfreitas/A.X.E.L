[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axel-tech-assistant"
version = "0.1.0"
description = "A.X.E.L. — assistente técnico via CLI para debug e otimização de Python/SQL, com IA generativa local via Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Freitas" }]
keywords = ["cli", "llm", "ollama", "prompt-engineering", "python", "sql", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
axel = "app.main:main"

[project.urls]
Repository = "https://github.com/gustavfreitas/A.X.E.L."

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.txt"]
